name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]

jobs:
  publish:
    name: Build · Test · Publish (with provenance)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for npm --provenance (GitHub OIDC attestation)
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Publish with provenance
        # --provenance requires Node.js 20+ and npm 9.5+
        # The OIDC token (id-token: write) is used automatically by npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
